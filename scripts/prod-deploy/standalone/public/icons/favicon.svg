<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 98">
  <!-- Генератор AR-меток: метка «жирный ArUco», 1 юнит = 10px, сторона 9.8u,
       рамка 1.4u, отбивка 1u, матрица 5x5 от 24px. Узор = FALLBACK движка:
       10011 / 01100 / 11010 / 00101 / 11010 (13 чернил) -->
  <rect x="0" y="0" width="98" height="98" rx="10" fill="#1C1917"/>
  <rect x="14" y="14" width="70" height="70" fill="#FFFFFF"/>
  <g fill="#1C1917">
    <!-- 10011 -->
    <rect x="24" y="24" width="10" height="10"/><rect x="54" y="24" width="10" height="10"/><rect x="64" y="24" width="10" height="10"/>
    <!-- 01100 -->
    <rect x="34" y="34" width="10" height="10"/><rect x="44" y="34" width="10" height="10"/>
    <!-- 11010 -->
    <rect x="24" y="44" width="10" height="10"/><rect x="34" y="44" width="10" height="10"/><rect x="54" y="44" width="10" height="10"/>
    <!-- 00101 -->
    <rect x="44" y="54" width="10" height="10"/><rect x="64" y="54" width="10" height="10"/>
    <!-- 11010 -->
    <rect x="24" y="64" width="10" height="10"/><rect x="34" y="64" width="10" height="10"/><rect x="54" y="64" width="10" height="10"/>
  </g>
</svg>
